<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة قوات الأمن الخاصة | S.S.F</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(to bottom, #000000 50%, #1a1a1a 80%, #ffffff 100%);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container { width: 100%; max-width: 400px; padding: 20px; padding-top: 30px; }

        /* تنسيق الشعار من صورتك المرفوعة */
        .logo-wrapper { text-align: center; margin-bottom: 20px; }
        .main-logo {
            width: 140px;
            height: auto;
            margin: 0 auto;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.3));
        }

        .btn-main {
            background: white; color: black; font-weight: 900; padding: 18px;
            border-radius: 15px; text-align: center; display: block;
            text-decoration: none; margin-bottom: 12px; transition: 0.3s;
        }

        .btn-sub {
            background: black; color: white; border: 1px solid #333;
            font-weight: 700; padding: 18px; border-radius: 15px;
            text-align: center; display: block; text-decoration: none;
            margin-bottom: 12px; transition: 0.3s;
        }

        .btn-cert {
            background: linear-gradient(45deg, #000, #111);
            color: white; border: 1px solid #ffd700;
            font-weight: 700; padding: 18px; border-radius: 15px;
            text-align: center; display: block; text-decoration: none;
            margin-bottom: 25px; transition: 0.3s;
        }

        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 40px; }
        
        .card {
            background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 20px;
            padding: 30px 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
            text-decoration: none; color: white; transition: 0.3s;
        }

        .info-card {
            background: white; color: black; border-radius: 35px;
            padding: 35px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-wrapper" data-aos="zoom-in">
            <img src="1200px-Special_Security_Forces_Saudi_Arabia.svg.png" alt="S.S.F Logo" class="main-logo">
        </div>

        <div class="text-center mb-8" data-aos="fade-up">
            <h1 class="text-xl font-black">بوابة قوات الأمن الخاصة</h1>
        </div>

        <a href="dashboard.html" class="btn-main" data-aos="fade-up" data-aos-delay="100">لوحة التحكم</a>
        
        <a href="accreditation.html" class="btn-sub" data-aos="fade-up" data-aos-delay="200">
            <i class="fa-solid fa-scroll ml-2 text-blue-400"></i> نظام الاعتماد العسكري
        </a>
        
        <a href="https://ku5b.github.io/-/index.html" class="btn-cert" data-aos="fade-up" data-aos-delay="300">
            <i class="fa-solid fa-certificate text-yellow-500 ml-2"></i> بوابة شهادات القوات
        </a>

        <div class="grid-container">
            <a href="https://docs.google.com/spreadsheets/d/18BFOMBgPdvZDGeiDK_FdPtFx-SQvicE5I3pPFt6B_eQ/edit?usp=drivesdk" target="_blank" class="card" data-aos="zoom-in" data-aos-delay="400">
                <i class="fa-solid fa-file-lines"></i> <span>اللائحة</span>
            </a>

            <a href="staff.html" class="card" data-aos="zoom-in" data-aos-delay="500">
                <i class="fa-solid fa-shield-halved"></i> <span>أعضاء القيادة</span>
            </a>
        </div>

        <div class="info-card" data-aos="fade-up">
            <h2 class="text-lg font-black border-r-4 border-black pr-2 mb-3">تعريف قوات الامن الخاصة</h2>
            <p class="text-sm font-bold opacity-80 leading-relaxed">
                نحن نخبة من المقاتلين مكرسين لحماية الأمن وتنفيذ العمليات عالية الخطورة.
            </p>
        </div>

        <div class="text-center py-4 opacity-30 text-[10px] font-black text-black">
            S.S.F UNIT • 2026
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });
    </script>
</body>
</html>
