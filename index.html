<div class="soldier-of-week-card" data-aos="fade-up">
    <div class="soldier-badge"><i class="fa-solid fa-medal"></i> متميز الأسبوع</div>
    
    <div class="soldier-content">
        <div class="soldier-avatar">
            <img src="soldier.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/619/619153.png'">
        </div>
        <div class="soldier-info">
            <h3 class="name">النقيب/ سلطان التميمي</h3>
            <p class="desc">نظير الانضباط العالي والتميز الميداني</p>
            
            <div class="countdown-wrapper">
                <span class="timer-label">ينتهي التميز خلال:</span>
                <div id="countdown" class="timer-digits">00:00:00:00</div>
            </div>
        </div>
    </div>
</div>

<style>
    /* تنسيق العداد */
    .countdown-wrapper {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 215, 0, 0.2);
    }
    .timer-label {
        font-size: 0.65rem;
        color: #ffd700;
        font-weight: 900;
        display: block;
        margin-bottom: 2px;
    }
    .timer-digits {
        font-family: monospace;
        font-size: 0.9rem;
        font-weight: 900;
        color: white;
        letter-spacing: 1px;
    }
    /* تحسينات الخانة */
    .soldier-of-week-card {
        background: #0a0a0a;
        border: 1px solid #ffd700;
        border-radius: 20px;
        padding: 20px;
        margin-bottom: 25px;
        position: relative;
    }
    .soldier-badge {
        position: absolute; top: -10px; left: 20px;
        background: #ffd700; color: #000; font-size: 10px;
        font-weight: 900; padding: 4px 12px; border-radius: 10px;
    }
    .soldier-content { display: flex; align-items: center; gap: 15px; }
    .soldier-avatar {
        width: 85px; height: 85px; border-radius: 50%;
        border: 2px solid #ffd700; overflow: hidden; background: #000; flex-shrink: 0;
    }
    .soldier-info .name { color: #ffd700; font-weight: 900; font-size: 1rem; }
    .soldier-info .desc { font-size: 0.75rem; opacity: 0.7; font-weight: 700; }
</style>

<script>
    // سكربت العداد الزمني (ينتهي كل يوم سبت)
    function updateCountdown() {
        const now = new Date();
        const nextSaturday = new Date();
        nextSaturday.setDate(now.getDate() + (7 - now.getDay()) % 7 || 7);
        nextSaturday.setHours(23, 59, 59, 0);

        const diff = nextSaturday - now;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const mins = Math.floor((diff / 1000 / 60) % 60);
        const secs = Math.floor((diff / 1000) % 60);

        document.getElementById("countdown").innerHTML = 
            `${days} يوم و ${hours}:${mins}:${secs}`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
</script>
