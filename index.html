<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد مبارك | بوابة قوات الأمن الخاصة</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
            min-height: 100vh;
            margin: 0;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* زينة علوية (حبال زينة) */
        .eid-decoration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-image: url('https://www.transparentpng.com/download/eid-mubarak/gold-lanterns-eid-mubarak-png-free-download-T9G2m1.png');
            background-size: contain;
            background-repeat: repeat-x;
            opacity: 0.6;
            pointer-events: none;
        }

        .container { width: 100%; max-width: 400px; padding: 20px; padding-top: 60px; z-index: 10; }

        .logo-wrapper { text-align: center; margin-bottom: 20px; }
        .main-logo {
            width: 130px;
            height: auto;
            margin: 0 auto;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
        }

        .eid-wish {
            text-align: center;
            color: #ffd700;
            font-weight: 900;
            font-size: 1.3rem;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { opacity: 0.8; transform: scale(1); }
            to { opacity: 1; transform: scale(1.05); }
        }

        .btn-eid {
            background: linear-gradient(45deg, #ffd700, #b8860b);
            color: black; font-weight: 900; padding: 18px;
            border-radius: 15px; text-align: center; display: block;
            text-decoration: none; margin-bottom: 12px; transition: 0.3s;
            box-shadow: 0 5px 20px rgba(218, 165, 32, 0.4);
        }

        .btn-sub-eid {
            background: rgba(255, 215, 0, 0.05); color: white; border: 1px solid #ffd700;
            font-weight: 700; padding: 18px; border-radius: 15px;
            text-align: center; display: block; text-decoration: none;
            margin-bottom: 12px; transition: 0.3s;
        }

        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 40px; }
        
        .card-eid {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 215, 0, 0.2); border-radius: 20px;
            padding: 30px 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
            text-decoration: none; color: white; transition: 0.3s;
        }

        .info-card-eid {
            background: #ffffff; color: #000; border-radius: 30px;
            padding: 30px; width: 100%; box-shadow: 0 10px 40px rgba(255,215,0,0.2);
            margin-bottom: 30px; border-top: 5px solid #ffd700;
        }
    </style>
</head>
<body>

    <div class="eid-decoration"></div>

    <div class="container">
        <div class="logo-wrapper" data-aos="zoom-in">
            <img src="1200px-Special_Security_Forces_Saudi_Arabia.svg.png" alt="S.S.F Logo" class="main-logo">
        </div>

        <div class="eid-wish" data-aos="fade-down">
            <i class="fa-solid fa-moon"></i> عيدكم مبارك <i class="fa-solid fa-star"></i>
        </div>

        <a href="dashboard.html" class="btn-eid" data-aos="fade-up" data-aos-delay="100" onclick="launchFireworks()">
            <i class="fa-solid fa-mosque ml-2"></i> دخول البوابة الرئيسية
        </a>
        
        <a href="accreditation.html" class="btn-sub-eid" data-aos="fade-up" data-aos-delay="200">
            <i class="fa-solid fa-scroll ml-2 text-yellow-500"></i> نظام الاعتماد العسكري
        </a>
        
        <a href="https://ku5b.github.io/-/index.html" class="btn-sub-eid" data-aos="fade-up" data-aos-delay="300">
            <i class="fa-solid fa-certificate text-yellow-500 ml-2"></i> بوابة الشهادات
        </a>

        <div class="grid-container">
            <a href="https://docs.google.com/spreadsheets/d/18BFOMBgPdvZDGeiDK_FdPtFx-SQvicE5I3pPFt6B_eQ/edit?usp=drivesdk" target="_blank" class="card-eid" data-aos="zoom-in" data-aos-delay="400">
                <i class="fa-solid fa-file-lines text-yellow-500"></i> <span>اللائحة</span>
            </a>
            <a href="staff.html" class="card-eid" data-aos="zoom-in" data-aos-delay="500">
                <i class="fa-solid fa-shield-halved text-yellow-500"></i> <span>أعضاء القيادة</span>
            </a>
        </div>

        <div class="info-card-eid" data-aos="fade-up">
            <h2 class="text-lg font-black mb-2 flex items-center gap-2">
                <i class="fa-solid fa-envelope-open-text"></i> قوات الامن الخاصة
            </h2>
            <p class="text-sm font-bold opacity-80 leading-relaxed">
                نهنئكم بحلول عيد الفطر المبارك، وتقبل الله منا ومنكم صالح الأعمال. دمتم ذخراً للوطن.
            </p>
        </div>

        <div class="text-center py-4 opacity-40 text-[10px] font-black text-yellow-500 uppercase tracking-widest">
            Special Forces • Eid Edition 2026
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        // وظيفة الألعاب النارية عند الفتح
        window.onload = function() {
            launchFireworks();
        };

        function launchFireworks() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
              confetti({
                particleCount: 3,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#ffd700', '#ffffff', '#b8860b']
              });
              confetti({
                particleCount: 3,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#ffd700', '#ffffff', '#b8860b']
              });

              if (Date.now() < end) {
                requestAnimationFrame(frame);
              }
            }());
        }
    </script>
</body>
</html>
